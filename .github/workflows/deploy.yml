name: Deploy Count Scaffold Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/count_scaffold/count_scaffold_backend
            git pull origin main
            sudo docker stop count_backend || true
            sudo docker rm count_backend || true
            sudo docker build -t count_backend .
            sudo docker run -d --name count_backend --restart unless-stopped -p 8000:8000 count_backend